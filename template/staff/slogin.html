<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <title>OLC Enterprises - Bootstrap Shop Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet"> 

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

    <style>
        body ,.navbar-expand-lg .navbar-collapse{
            background:#666666;
        }
    </style>
    <style>
        /*author:starttemplate*/
    /*reference site : starttemplate.com*/
    
    body {
      background-image:url('../static/img/1.10.jpg');
      background-position:center;
      background-size:cover;
      
      -webkit-font-smoothing: antialiased;
      font: normal 14px Roboto,arial,sans-serif;
      font-family: 'Times New Roman', cursive!important;
    }
    
    .container {
        padding: 110px;
    }
    ::placeholder { /* Chrome, Firefox, Opera, Safari 10.1+ */
        color: #ffffff!important;
        opacity: 1; /* Firefox */
        font-size:18px!important;
    }
    .form-login {
        background-color:#8b4c4c1a;
        padding-top: 10px;
        padding-bottom: 20px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 15px;
        border-color:#d2d2d2;
        border-width: 5px;
        color:white;
        box-shadow:0 1px 0 #562f2f00;
    }
    .form-control{
        background:transparent!important;
        color:white!important;
        font-size: 18px!important;
    }
    h1{
        color:white!important;
    }
    h4 { 
     border:0 solid #fff; 
     border-bottom-width:1px;
     padding-bottom:10px;
     text-align: center;
    }
    
    .form-control {
        border-radius: 10px;
    }
    .text-white{
        color: white!important;
    }
    .wrapper {
        text-align: center;
    }
    .footer p{
        font-size: 18px;
    }
    </style>
            
            <a href="/" class="nav-item nav-link active"style="color:black;"><b>Home</b></a>

            <div>
                <center>
                <div>
                    <div class="row justify-content-md-center py-5 px-xl-5">
                        <div class="col-md-5 col-12 py-5">
                            <div>
                                <h2><i class="fa fa-user-circle" style="font-size:50px"></i><br>STAFF LOGIN</h2>
                            </div>
                            <form action="" method="POST" enctype="multipart-form/data" >
                                {% csrf_token %}
                                {% for msg in messages %}
                                <div class="alert alert-danger" role="alert">
                                    <h2>{{msg}}</h2>
                                    {% endfor %}
                                    <input type="email" name="Email" class="form-control border-white p-4" placeholder="Email"><br>
                                    <input type="password" name="Password"class="form-control border-white p-4" placeholder="Password"><br>
                                    <div class="input-group-append">
                                        <button class="btn btn-secondary px-4">Login</button>
                                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                    <a href="staffreg" class="nav-item nav-link active"style="color:white;"><b>Create New Account</b></a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

    

    <!-- Back to Top -->
    <a href="#" class="btn btn-primary back-to-top"><i class="fa fa-angle-double-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

    <!-- Contact Javascript File -->
    <script src="{% static 'mail/jqBootstrapValidation.min.js' %}"></script>
    <script src="{% static 'mail/contact.js' %}"></script>

    <!-- Template Javascript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
